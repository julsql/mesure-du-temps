server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Static site with no inline script/style: a strict CSP is free.
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Images and stylesheets keep stable filenames: cache them, but revalidate CSS daily.
    location /assets/images/ {
        expires 30d;
    }
    location /assets/css/ {
        expires 1d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css image/svg+xml;
    gzip_min_length 1024;
}
