server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Static site with no inline script/style: a strict CSP is free (Umami analytics allowed).
    # (JSON-LD blocks are data, not executed scripts: they are not affected by script-src.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.julsql.fr; connect-src 'self' https://stats.julsql.fr; font-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caching relies on `expires` only: an `add_header` inside a location would drop the
    # security headers above. Assets keep stable filenames, so CSS/JS revalidate daily.
    location /assets/images/ {
        expires 30d;
    }
    location /assets/fonts/ {
        expires 1y;
    }
    location /assets/css/ {
        expires 1d;
    }
    location /assets/js/ {
        expires 1d;
    }
    location = /favicon.ico {
        alias /usr/share/nginx/html/assets/images/favicon.ico;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html is always compressed once gzip is on.
    gzip_types text/css text/plain text/xml application/javascript application/json
        application/ld+json application/xml image/svg+xml image/x-icon;
}
